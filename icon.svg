<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3d2f"/><stop offset="0.62" stop-color="#1f5a46"/><stop offset="1" stop-color="#c98a2b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a8"/><stop offset="1" stop-color="#e0a83a"/>
    </radialGradient>
    <clipPath id="hz"><rect x="0" y="0" width="512" height="352"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- rising sun rays -->
  <g clip-path="url(#hz)" stroke="#f4d58a" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="352" x2="256" y2="214"/><line x1="256" y1="352" x2="168" y2="238"/><line x1="256" y1="352" x2="344" y2="238"/>
    <line x1="256" y1="352" x2="112" y2="292"/><line x1="256" y1="352" x2="400" y2="292"/>
  </g>
  <g clip-path="url(#hz)"><circle cx="256" cy="352" r="72" fill="url(#sun)"/></g>
  <!-- crescent -->
  <path d="M206 92a92 92 0 1 0 108 124a74 74 0 1 1-108-124z" fill="#f4d58a"/>
  <!-- 8-point star -->
  <g transform="translate(348 104)" fill="#fff6dc">
    <rect x="-22" y="-22" width="44" height="44"/><rect x="-22" y="-22" width="44" height="44" transform="rotate(45)"/>
  </g>
  <!-- horizon / tasbih beads -->
  <rect x="0" y="352" width="512" height="160" fill="#0f3d2f" opacity="0.35"/>
  <path d="M60 352 H452" stroke="#f4d58a" stroke-width="6" stroke-linecap="round"/>
  <g fill="#fff6dc">
    <circle cx="136" cy="420" r="15"/><circle cx="176" cy="432" r="15"/><circle cx="216" cy="439" r="15"/><circle cx="256" cy="441" r="17" fill="#f4d58a"/>
    <circle cx="296" cy="439" r="15"/><circle cx="336" cy="432" r="15"/><circle cx="376" cy="420" r="15"/>
  </g>
</svg>
